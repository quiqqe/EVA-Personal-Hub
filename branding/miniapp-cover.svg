<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- BotFather /newapp asks for a 640×360 picture -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b5cf6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="120" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="560" cy="300" r="150" fill="#fff" opacity=".06"/>
  <circle cx="610" cy="60" r="70" fill="#a5f3fc" opacity=".12"/>
  <g transform="translate(64 112)">
    <rect width="136" height="136" rx="38" fill="#fff" fill-opacity=".14"/>
    <g transform="translate(68 68) scale(3) translate(-32 -32)">
      <g fill="#fff">
        <rect x="17" y="16" width="8" height="32" rx="4"/>
        <rect x="17" y="16" width="30" height="8" rx="4"/>
        <rect x="17" y="40" width="30" height="8" rx="4"/>
        <rect x="17" y="28" width="17" height="8" rx="4"/>
      </g>
      <circle cx="43" cy="32" r="4.5" fill="#a5f3fc"/>
    </g>
  </g>
  <g font-family="Manrope, Inter, 'Segoe UI', Arial, sans-serif" fill="#fff">
    <text x="232" y="172" font-size="46" font-weight="800" letter-spacing="-1">EVA Personal</text>
    <text x="234" y="214" font-size="22" font-weight="600" fill-opacity=".85">Деньги, группы, валюты и крипта</text>
    <text x="234" y="244" font-size="22" font-weight="600" fill-opacity=".85">— всё в одном месте</text>
  </g>
</svg>
