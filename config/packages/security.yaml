security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users:
            entity: { class: App\Entity\User }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: users
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: hub
                username_parameter: email
                password_parameter: password
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000
                always_remember_me: true
            logout:
                path: logout
                enable_csrf: true
            login_throttling:
                max_attempts: 5

    access_control:
        - { path: ^/(login|login/telegram|login/telegram/check|login/telegram/new|telegram/webhook|register|password/forgot|manifest\.webmanifest)$, roles: PUBLIC_ACCESS }
        - { path: ^/password/reset/, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
