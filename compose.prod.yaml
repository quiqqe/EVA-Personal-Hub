# Production: docker compose -f compose.prod.yaml --env-file .env.local up -d --build

# every container: logs rotate at 10 MB, 5 files kept — they must never fill the disk
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - app

  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env.local
        required: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eva}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}@postgres:5432/${POSTGRES_DB:-eva}?serverVersion=16&charset=utf8
    volumes:
      - sessions:/app/var/sessions
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eva}
      POSTGRES_USER: ${POSTGRES_USER:-eva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-eva}", "-U", "${POSTGRES_USER:-eva}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  sessions:
